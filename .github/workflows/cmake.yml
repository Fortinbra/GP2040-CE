name: CMake

on:
    push:
        branches: ["main", "develop", "feature/**"]
    pull_request:
        branches: ["main", "develop"]
    workflow_dispatch:
        inputs:
            board_config:
                description: "Registered GP2040 target (empty or all builds every target)"
                required: false
                type: string
                default: ""

env:
    BUILD_TYPE: Release

jobs:
    call-node-workflow:
        uses: ./.github/workflows/node.js.yml

    build-config-list:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - uses: actions/checkout@v6.0.1
            - uses: jwlawson/actions-setup-cmake@v2
              with:
                  cmake-version: "3.31.x"
            - name: Test board registry
              run: cmake -G Ninja -P tests/board-selection.cmake
            - id: set-matrix
              env:
                  REQUESTED_BOARD: ${{ inputs.board_config }}
              run: |
                  cmake -G Ninja -DGP2040_BOARD="$REQUESTED_BOARD" -DGP2040_BOARD_OUTPUT=build/boards.json -P modules/ListBoards.cmake
                  echo "matrix=$(jq -c . build/boards.json)" >> "$GITHUB_OUTPUT"

    build:
        needs: [call-node-workflow, build-config-list]
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                GP2040_BOARD: ${{ fromJSON(needs.build-config-list.outputs.matrix) }}
                include:
                    - GP2040_BOARD: CustomPico
                      board_dirs: build/board-selection-tests/packages with spaces
                      test_only: true
        env:
            SELECTED_BOARD: ${{ matrix.GP2040_BOARD }}
            BOARD_DIRS: ${{ matrix.board_dirs }}
            PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
            SKIP_WEBBUILD: "TRUE"
        steps:
            - name: Setup CMake
              uses: jwlawson/actions-setup-cmake@v2
              with:
                  cmake-version: "3.31.x"
            - name: Checkout GP2040-CE
              uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0
                  fetch-tags: true
            - name: GNU Arm Embedded Toolchain
              uses: carlosperate/arm-none-eabi-gcc-action@v1
            - name: Install build prerequisites
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ninja-build
                  python3 -m pip install pycryptodomex
            - name: Checkout Pico SDK 2.3.1
              uses: actions/checkout@v6.0.1
              with:
                  repository: raspberrypi/pico-sdk
                  ref: 2.3.1
                  path: pico-sdk
            - name: Checkout Pico SDK submodules
              working-directory: ${{ github.workspace }}/pico-sdk
              run: git submodule update --init --recursive
            - name: Test SDK selection and external packages
              if: ${{ matrix.test_only }}
              run: cmake -G Ninja -P tests/board-selection.cmake
            - name: Download shared web assets
              uses: actions/download-artifact@v7.0.0
              with:
                  name: fsData
                  path: ${{ github.workspace }}/lib/httpd/
            - name: Configure selected target
              working-directory: ${{ runner.temp }}
              run: >-
                  cmake -G Ninja -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" --fresh
                  -DGP2040_BOARD="$SELECTED_BOARD"
                  -DGP2040_BOARD_DIRS="$BOARD_DIRS"
                  -DGP2040_BOARD_TEST_EXPECTATIONS=ON
                  -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
            - name: Build firmware
              run: ninja -C build
            - name: Upload UF2 artifact
              if: ${{ !matrix.test_only }}
              uses: actions/upload-artifact@v6.0.0
              with:
                  name: GP2040-CE - ${{ matrix.GP2040_BOARD }}
                  path: ${{ github.workspace }}/build/GP2040-CE_*_${{ matrix.GP2040_BOARD }}.uf2
                  if-no-files-found: error
            - name: Upload baseline ELF artifact
              if: ${{ matrix.GP2040_BOARD == 'Pico' }}
              uses: actions/upload-artifact@v6.0.0
              with:
                  name: elf
                  path: ${{ github.workspace }}/build/GP2040-CE_*_${{ matrix.GP2040_BOARD }}.elf
                  if-no-files-found: error
