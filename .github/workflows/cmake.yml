name: GPBuilder Release

on:
  push:
    branches: ["main", "gpbuilder-release", "lipo2xlw-test"]
  workflow_dispatch:

env:
  RELEASE_TAG: v0.8.0
  RELEASE_VERSION: 0.8.0

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Pico
            configs: firmware/configs
          - board: OpenCore0
            configs: registry/configs
          - board: PimoroniPicoLipo2XLW
            configs: registry/configs
    steps:
      - name: Check out firmware
        uses: actions/checkout@v6.0.1
        with:
          path: firmware
          fetch-depth: 0

      - name: Check out Board-Config-Registry
        uses: actions/checkout@v6.0.1
        with:
          repository: Fortinbra/Board-Config-Registry
          ref: add-pimoroni-pico-lipo2-xl-w
          path: registry

      - name: Tag firmware for UF2 naming
        working-directory: firmware
        run: |
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git tag "${RELEASE_TAG}"
          fi
          git describe --tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Pico tools
        id: pico-tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.pico-sdk/cmake
            ~/.pico-sdk/ninja
            ~/.pico-sdk/toolchain
          key: pico-tools-linux-cmake4.3.4-ninja1.13.2-arm15.2rel1

      - name: Provision Pico tools
        if: steps.pico-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          root="$HOME/.pico-sdk"
          mkdir -p "$root/cmake/v4.3.4" "$root/ninja/v1.13.2" "$root/toolchain/15_2_Rel1"
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v4.3.4/cmake-4.3.4-linux-x86_64.tar.gz \
            | tar -xz --strip-components=1 -C "$root/cmake/v4.3.4"
          curl -fsSL -o /tmp/ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          unzip -o /tmp/ninja.zip -d "$root/ninja/v1.13.2"
          chmod +x "$root/ninja/v1.13.2/ninja"
          curl -fsSL https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz \
            | tar -xJ --strip-components=1 -C "$root/toolchain/15_2_Rel1"

      - name: Build firmware with GPBuilder
        id: gpbuilder
        uses: becauseimclever/GPBuilder@rp2350-support
        with:
          command: build
          firmware: ${{ github.workspace }}/firmware
          release: main
          board: ${{ matrix.board }}
          configs: ${{ github.workspace }}/${{ matrix.configs }}

      - name: Upload firmware
        uses: actions/upload-artifact@v6.0.0
        with:
          name: firmware-${{ matrix.board }}
          path: |
            ${{ steps.gpbuilder.outputs.uf2-path }}
            ${{ steps.gpbuilder.outputs.build-metadata-path }}
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: firmware-*
          path: downloads

      - name: Rename release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          for dir in downloads/firmware-*; do
            board="${dir#downloads/firmware-}"
            uf2="$(find "$dir" -name '*.uf2' -print -quit)"
            cp "$uf2" "assets/GP2040-CE_${RELEASE_VERSION}_${board}.uf2"
          done
          ls -l assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" assets/*.uf2 --clobber
          else
            gh release create "${RELEASE_TAG}" assets/*.uf2 --target "${GITHUB_SHA}" --title "${RELEASE_TAG}" --generate-notes
          fi